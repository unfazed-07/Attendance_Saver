services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AZURE_SQL_SERVER: ${AZURE_SQL_SERVER:?Set AZURE_SQL_SERVER in .env}
      AZURE_SQL_DATABASE: ${AZURE_SQL_DATABASE:?Set AZURE_SQL_DATABASE in .env}
      AZURE_SQL_USERNAME: ${AZURE_SQL_USERNAME:?Set AZURE_SQL_USERNAME in .env}
      AZURE_SQL_PASSWORD: ${AZURE_SQL_PASSWORD:?Set AZURE_SQL_PASSWORD in .env}
      AZURE_SQL_DRIVER: ${AZURE_SQL_DRIVER:-ODBC Driver 18 for SQL Server}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:?Set AZURE_STORAGE_CONNECTION_STRING in .env}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      OTP_SIGNING_SECRET: ${OTP_SIGNING_SECRET:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
